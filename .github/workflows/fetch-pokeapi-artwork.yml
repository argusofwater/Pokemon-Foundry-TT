name: Fetch Commander PokeAPI artwork

on:
  workflow_dispatch:
  push:
    branches:
      - codex/foundry-base-pass
    paths:
      - "tools/commander/fetch-pokeapi-artwork.mjs"
      - "tools/commander/utils.mjs"
      - "package.json"
      - "temp/compendium-translated/species/**"
      - "temp/compendium-translated/items/**"
      - "temp/compendium-translated/learnsets/**"
      - "temp/compendium-raw/pokeapi/data/v2/csv/pokemon.csv"

permissions:
  contents: write

concurrency:
  group: commander-compendium-writer
  cancel-in-progress: false

jobs:
  fetch-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/foundry-base-pass
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install tooling dependency
        run: npm install --no-audit --no-fund

      - name: Fetch pinned PokeAPI sprites
        run: npm run artwork:fetch-pokeapi

      - name: Commit artwork and manifests
        run: |
          git config user.name "Commander Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json static/assets/commander temp/compendium-translated/artwork
          if git diff --cached --quiet; then
            echo "No artwork changes to commit."
            exit 0
          fi
          git commit -m "Import PokeAPI sprites for Commander compendiums"
          git pull --rebase origin codex/foundry-base-pass
          git push origin HEAD:codex/foundry-base-pass
