name: Translate Commander canonical learnsets

on:
  workflow_dispatch:
  push:
    branches:
      - codex/foundry-base-pass
    paths:
      - "tools/commander/translate-learnsets.mjs"
      - "package.json"
      - "temp/compendium-raw/pokemon-showdown/data/learnsets.ts"
      - "temp/compendium-raw/pokemon-showdown/data/moves.ts"
      - "temp/compendium-translated/species/**"

permissions:
  contents: write

concurrency:
  group: commander-learnset-writer
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/foundry-base-pass

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install translation dependency
        run: npm install --no-audit --no-fund

      - name: Translate learnsets
        run: npm run compendium:translate-learnsets

      - name: Commit translated learnset staging data
        run: |
          git config user.name "Commander Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json temp/compendium-translated/learnsets
          if git diff --cached --quiet; then
            echo "No translated learnset changes to commit."
            exit 0
          fi
          git commit -m "Attach canonical learnsets to translated species"
          git push origin HEAD:codex/foundry-base-pass
